<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Записи пациентов</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Записи">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --muted:#8e8e93; --line:#e5e5ea;
  --accent:#0a84ff; --accent-soft:#e5f1ff; --ok:#34c759; --danger:#ff3b30; --warn-bg:#fff4e5; --warn:#b25e00;
  --field:#f2f2f7; --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --muted:#8e8e93; --line:#38383a;
    --accent:#0a84ff; --accent-soft:#0a2a4d; --field:#2c2c2e; --warn-bg:#3a2a12; --warn:#ffb340; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:17px;color:var(--text)}
main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px 24px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:15px}
.pill{background:var(--card);border-radius:999px;padding:7px 14px;font-size:15px;font-weight:600;color:var(--accent);box-shadow:var(--shadow);position:relative;overflow:hidden;white-space:nowrap}
.pill input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.tools{display:flex;gap:8px}
.week{display:grid;grid-template-columns:28px repeat(7,1fr) 28px;align-items:center;gap:2px;background:var(--card);border-radius:14px;padding:8px 4px;box-shadow:var(--shadow);margin-bottom:14px}
.week .nav{color:var(--accent);font-size:24px;height:44px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:10px;height:56px}
.day small{font-size:12px;color:var(--muted)}
.day b{font-size:17px;font-weight:600;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%}
.day.today b{color:var(--accent)}
.day.sel b{background:var(--accent);color:#fff}
.day i{width:5px;height:5px;border-radius:50%;background:transparent}
.day.has i{background:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.appt{display:flex;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;box-shadow:var(--shadow);width:100%;border-left:4px solid var(--accent)}
.appt .t{min-width:52px;font-variant-numeric:tabular-nums}
.appt .t b{display:block;font-size:17px}
.appt .t span{color:var(--muted);font-size:14px}
.appt .who{font-weight:600}
.appt .what{color:var(--muted);font-size:15px}
.appt.done{border-left-color:var(--ok)}
.appt.cancelled{border-left-color:var(--muted);opacity:.55}
.appt.cancelled .who{text-decoration:line-through}
.tag{font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;margin-left:6px;vertical-align:2px}
.tag.done{background:var(--ok);color:#fff}
.tag.cancelled{background:var(--muted);color:#fff}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty b{display:block;color:var(--text);font-size:19px;margin-bottom:4px}
.fab{position:fixed;right:20px;bottom:calc(80px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;font-size:32px;line-height:58px;text-align:center;box-shadow:0 4px 14px rgba(10,132,255,.4);z-index:5}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:11px;color:var(--muted)}
.tabs button.on{color:var(--accent)}
.tabs svg{width:26px;height:26px}
.search{width:100%;border:0;border-radius:12px;background:var(--card);padding:10px 14px;margin-bottom:12px;box-shadow:var(--shadow);outline:none}
.group{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;width:100%;text-align:left;border-bottom:.5px solid var(--line)}
.row:last-child{border-bottom:0}
.row .r{color:var(--muted);font-size:15px;text-align:right;white-space:nowrap}
.row small{display:block;color:var(--muted);font-size:14px}
.banner{display:block;width:100%;text-align:left;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:15px}
.h2{font-size:14px;color:var(--muted);text-transform:uppercase;margin:22px 4px 6px;letter-spacing:.3px}
.p{color:var(--muted);font-size:15px;margin:6px 4px}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20}
.sheet-wrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity .22s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:94vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:14px 14px 0 0;transform:translateY(100%);transition:transform .25s ease;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.open .backdrop{opacity:1}
.open .sheet{transform:none}
.sh-head{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--bg);z-index:2;border-bottom:.5px solid var(--line)}
.sh-head b{font-size:17px}
.link{color:var(--accent);font-size:17px;min-width:70px;text-align:left}
.link.strong{font-weight:600;text-align:right}
.form{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.field{display:block;background:var(--card);border-radius:12px;padding:8px 14px}
.field span{display:block;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:0;background:transparent;outline:none;padding:2px 0;resize:vertical;-webkit-appearance:none;appearance:none;min-height:26px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sugg{display:flex;flex-direction:column;gap:0;background:var(--card);border-radius:12px;overflow:hidden;margin-top:-4px}
.sugg:empty{display:none}
.sugg button{padding:10px 14px;text-align:left;border-bottom:.5px solid var(--line)}
.sugg button:last-child{border-bottom:0}
.sugg small{color:var(--muted);margin-left:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--field);border-radius:10px;padding:2px}
.seg button{padding:8px 4px;border-radius:8px;font-size:15px}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:15px}
.warn:empty{display:none}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--card);color:var(--accent);font-weight:600;text-align:center;text-decoration:none}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(40,40,40,.92);color:#fff;padding:10px 18px;border-radius:12px;font-size:15px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.switch{-webkit-appearance:none;appearance:none;flex:none;width:51px;height:31px;border-radius:999px;background:var(--line);position:relative;margin:0;transition:background .2s;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch:checked{background:var(--ok)}
.switch:checked::after{transform:translateX(20px)}
.how summary{list-style:none;cursor:pointer}
.how summary::-webkit-details-marker{display:none}
.how ol{padding:4px 16px 0 32px;margin:8px 0}
.how li{margin-bottom:8px}
.how a{color:var(--accent)}
.how .p{margin:6px 16px 12px}
</style>
</head>
<body>
<main id="main"></main>
<button class="fab" id="fab" aria-label="Добавить">+</button>
<nav class="tabs" id="tabs">
  <button data-tab="day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Записи</button>
  <button data-tab="patients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>Пациенты</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Ещё</button>
</nav>
<div class="sheet-wrap" id="sheetWrap" hidden><div class="backdrop" data-x="close"></div><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';
// ---------- хранилище ----------
const KEY = 'dent-v1';
let db = load();
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.patients) && Array.isArray(d.appts)) return d;
  } catch (e) {}
  return { patients: [], appts: [], lastBackup: null };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { alert('Не удалось сохранить данные: ' + e.message); }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

// ---------- утилиты ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = fromIso(s); d.setDate(d.getDate() + n); return iso(d); };
const today = () => iso(new Date());
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fromMin = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const WDS = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const DURS = [15, 20, 30, 45, 60, 90, 120, 180];
const STATUS = { planned: 'Ожидается', done: 'Пришёл', cancelled: 'Отменён' };
const getP = id => db.patients.find(p => p.id === id);
const getA = id => db.appts.find(a => a.id === id);
const pName = a => (getP(a.patientId) || {}).name || 'Без имени';
function dateLabel(s, withYear) {
  const d = fromIso(s);
  let t = `${d.getDate()} ${MON[d.getMonth()]}`;
  if (withYear || d.getFullYear() !== new Date().getFullYear()) t += ' ' + d.getFullYear();
  return t;
}
function relLabel(s) {
  const t = today();
  if (s === t) return 'Сегодня';
  if (s === addDays(t, 1)) return 'Завтра';
  if (s === addDays(t, -1)) return 'Вчера';
  return WD[fromIso(s).getDay()].replace(/^./, c => c.toUpperCase());
}
const byTime = (a, b) => (a.date + a.time).localeCompare(b.date + b.time);
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- состояние ----------
const state = { tab: 'day', sel: today(), q: '' };

// ---------- экраны ----------
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  $('#fab').hidden = state.tab === 'more';
  if (state.tab === 'day') renderDay();
  else if (state.tab === 'patients') renderPatients();
  else renderMore();
}

function backupBanner() {
  if (!db.appts.length && !db.patients.length) return '';
  const since = db.lastBackup || Math.min(...db.patients.concat(db.appts).map(x => x.created || Date.now()));
  const days = (Date.now() - since) / 864e5;
  if (days < 14) return '';
  return `<button class="banner" data-act="tab" data-v="more">💾 Давно не было резервной копии. Нажмите, чтобы сохранить.</button>`;
}
function installBanner() {
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (standalone) return '';
  return `<button class="banner" data-act="tab" data-v="more">📲 Установите приложение на экран «Домой»: так оно работает без интернета. Нажмите, чтобы узнать как.</button>`;
}

function renderDay() {
  const sel = state.sel, d = fromIso(sel), t = today();
  const start = addDays(sel, -((d.getDay() + 6) % 7));
  const busy = new Set(db.appts.filter(a => a.status !== 'cancelled').map(a => a.date));
  let week = '';
  for (let i = 0; i < 7; i++) {
    const s = addDays(start, i), dd = fromIso(s);
    week += `<button class="day${s === sel ? ' sel' : ''}${s === t ? ' today' : ''}${busy.has(s) ? ' has' : ''}" data-act="pick" data-v="${s}"><small>${WDS[dd.getDay()]}</small><b>${dd.getDate()}</b><i></i></button>`;
  }
  const list = db.appts.filter(a => a.date === sel).sort(byTime);
  const active = list.filter(a => a.status !== 'cancelled').length;
  $('#main').innerHTML = `
    ${installBanner()}${backupBanner()}
    <div class="top">
      <div><div class="big">${dateLabel(sel)}</div><div class="sub">${relLabel(sel)} · ${active ? active + ' ' + plural(active, 'запись', 'записи', 'записей') : 'нет записей'}</div></div>
      <div class="tools">
        ${sel !== t ? '<button class="pill" data-act="pick" data-v="' + t + '">Сегодня</button>' : ''}
        <label class="pill">Дата<input type="date" id="jump" value="${sel}"></label>
      </div>
    </div>
    <div class="week"><button class="nav" data-act="shift" data-v="-7" aria-label="Прошлая неделя">‹</button>${week}<button class="nav" data-act="shift" data-v="7" aria-label="Следующая неделя">›</button></div>
    <div class="list" id="dayList">
      ${list.length ? list.map(apptCard).join('') : `<div class="empty"><b>Записей нет</b>Нажмите «+», чтобы записать пациента.<br>Листайте влево-вправо, чтобы сменить день.</div>`}
    </div>`;
  $('#jump').addEventListener('change', e => { if (e.target.value) { state.sel = e.target.value; render(); } });
}
function apptCard(a) {
  const end = fromMin(toMin(a.time) + Number(a.dur || 30));
  const tag = a.status && a.status !== 'planned' ? `<span class="tag ${a.status}">${STATUS[a.status]}</span>` : '';
  const what = [a.service, a.note].filter(Boolean).map(esc).join(' · ');
  return `<button class="appt ${a.status || ''}" data-act="appt" data-v="${a.id}">
    <div class="t"><b>${a.time}</b><span>${end}</span></div>
    <div><div class="who">${esc(pName(a))}${tag}</div>${what ? `<div class="what">${what}</div>` : ''}</div></button>`;
}
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

function nextVisit(pid) {
  const t = today();
  return db.appts.filter(a => a.patientId === pid && a.status !== 'cancelled' && a.date >= t).sort(byTime)[0];
}
function renderPatients() {
  $('#main').innerHTML = `
    <div class="top"><div><div class="big">Пациенты</div><div class="sub">${db.patients.length} ${plural(db.patients.length, 'пациент', 'пациента', 'пациентов')}</div></div></div>
    <input class="search" id="q" type="search" placeholder="Поиск по имени или телефону" value="${esc(state.q)}">
    <div id="plist"></div>`;
  $('#q').addEventListener('input', e => { state.q = e.target.value; renderPList(); });
  renderPList();
}
function renderPList() {
  const q = state.q.trim().toLowerCase();
  const ps = db.patients
    .filter(p => !q || p.name.toLowerCase().includes(q) || (p.phone || '').replace(/\s/g, '').includes(q.replace(/\s/g, '')))
    .sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  $('#plist').innerHTML = ps.length
    ? `<div class="group">${ps.map(p => {
        const n = nextVisit(p.id);
        return `<button class="row" data-act="patient" data-v="${p.id}"><div>${esc(p.name)}${p.phone ? `<small>${esc(p.phone)}</small>` : ''}</div><div class="r">${n ? dateLabel(n.date) + ', ' + n.time : ''}</div></button>`;
      }).join('')}</div>`
    : `<div class="empty"><b>${q ? 'Никого не нашли' : 'Пациентов пока нет'}</b>${q ? '' : 'Они появятся сами при записи, или нажмите «+».'}</div>`;
}

function renderMore() {
  const last = db.lastBackup ? new Date(db.lastBackup) : null;
  $('#main').innerHTML = `
    <div class="top"><div><div class="big">Ещё</div></div></div>
    <div class="group">
      <div class="row"><div>Пациентов</div><div class="r">${db.patients.length}</div></div>
      <div class="row"><div>Записей</div><div class="r">${db.appts.length}</div></div>
    </div>
    <div class="h2">Календарь iPhone</div>
    <div class="group">
      <label class="row"><div>Синхронизировать с календарём</div><input type="checkbox" class="switch" id="syncOn"${syncCfg().on ? ' checked' : ''}></label>
      <button class="row" data-act="syncnow"><div style="color:var(--accent)">Синхронизировать сейчас</div></button>
    </div>
    <p class="p">Записи с сегодняшнего дня появляются в календаре «Пациенты» с напоминанием за час. Отменённые и удалённые записи из календаря исчезают. Прошлые события не меняются.</p>
    <details class="group how">
      <summary class="row"><div style="color:var(--accent)">Как настроить (один раз)</div></summary>
      <ol class="p">
        <li>Откройте «Календарь» → «Календари» внизу → «Добавить календарь». Назовите его <b>Пациенты</b> и выберите цвет. Если есть раздел «На iPhone», создайте календарь в нём: так записи не попадут в iCloud.</li>
        <li><a href="${SHORTCUT_FILE}" target="_blank" rel="noopener">Установите команду «Записи»</a> → «Добавить быструю команду». Если файл просто скачался, откройте его в «Файлы» → «Загрузки». Если спросит календарь, выберите «Пациенты». Не переименовывайте команду.</li>
        <li>«Настройки» → «Приложения» → «Команды» → «Дополнения» → включите «Разрешить удаление без подтверждения». Иначе iPhone будет каждый раз спрашивать перед обновлением календаря.</li>
        <li>Включите переключатель выше и нажмите «Синхронизировать сейчас». В первый раз разрешите команде доступ к календарю: «Разрешить всегда».</li>
      </ol>
      <p class="p">После каждого сохранения на секунду откроется приложение «Команды». Вернуться: «◀ Записи» в левом верхнем углу.</p>
      <p class="p">Данные передаются только внутри телефона, в интернет не уходят.</p>
    </details>
    <div class="h2">Резервная копия</div>
    <div class="group">
      <button class="row" data-act="export"><div style="color:var(--accent)">Сохранить копию в файл</div></button>
      <button class="row" data-act="import"><div style="color:var(--accent)">Восстановить из файла</div></button>
    </div>
    <p class="p">Последняя копия: ${last ? dateLabel(iso(last), true) + ', ' + pad(last.getHours()) + ':' + pad(last.getMinutes()) : 'ещё не делали'}.</p>
    <p class="p">Все данные хранятся только на этом телефоне. Если удалить приложение, они пропадут. Сохраняйте копию раз в неделю в «Файлы» или отправляйте себе в Telegram.</p>
    <div class="h2">Как установить на iPhone</div>
    <p class="p">1. Откройте ссылку в Safari.<br>2. Нажмите «Поделиться» (квадрат со стрелкой).<br>3. Выберите «На экран „Домой“».<br>4. Дальше открывайте только через значок на экране. Интернет не нужен.</p>
    <p class="p">Важно: в Safari и в значке на экране данные разные. Записывайте всё через значок.</p>`;
  $('#syncOn').addEventListener('change', e => {
    const c = syncCfg(); c.on = e.target.checked; setSyncCfg(c);
    if (c.on) calSync(true); else toast('Синхронизация выключена');
  });
}

// ---------- шторка ----------
let sheetGen = 0;
function openSheet(html, mount) {
  sheetGen++;
  const w = $('#sheetWrap');
  $('#sheet').innerHTML = html;
  $('#sheet').scrollTop = 0;
  w.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('open')));
  if (mount) mount($('#sheet'));
}
function closeSheet() {
  const g = ++sheetGen, w = $('#sheetWrap');
  w.classList.remove('open');
  if (document.activeElement) document.activeElement.blur();
  setTimeout(() => { if (g === sheetGen) { w.hidden = true; $('#sheet').innerHTML = ''; } }, 260);
}

// ---------- запись ----------
function defaultTime(date) {
  const list = db.appts.filter(a => a.date === date && a.status !== 'cancelled');
  if (!list.length) return '09:00';
  const end = Math.max(...list.map(a => toMin(a.time) + Number(a.dur || 30)));
  return end >= 24 * 60 ? '09:00' : fromMin(Math.ceil(end / 15) * 15);
}
function apptSheet(id, preset = {}) {
  const a = id ? getA(id) : null;
  const p = a ? getP(a.patientId) : (preset.patientId ? getP(preset.patientId) : null);
  const date = a ? a.date : (preset.date || state.sel);
  const time = a ? a.time : defaultTime(date);
  const dur = Number(a ? a.dur : 30);
  const durs = DURS.includes(dur) ? DURS : [...DURS, dur].sort((x, y) => x - y);
  const services = [...new Set(db.appts.map(x => x.service).filter(Boolean))].sort();
  let selPid = p ? p.id : null;
  let status = a ? (a.status || 'planned') : 'planned';

  openSheet(`
    <div class="sh-head"><button class="link" data-x="close">Отмена</button><b>${a ? 'Запись' : 'Новая запись'}</b><button class="link strong" data-x="save">Готово</button></div>
    <div class="form">
      <label class="field"><span>Пациент</span><input id="fName" autocomplete="off" autocapitalize="words" placeholder="Имя и фамилия" value="${esc(p ? p.name : '')}"></label>
      <div class="sugg" id="sugg"></div>
      <label class="field"><span>Телефон</span><input id="fPhone" type="tel" placeholder="+371 …" value="${esc(p ? p.phone : '')}"></label>
      <div class="row2">
        <label class="field"><span>Дата</span><input id="fDate" type="date" value="${date}"></label>
        <label class="field"><span>Время</span><input id="fTime" type="time" step="300" value="${time}"></label>
      </div>
      <label class="field"><span>Длительность</span><select id="fDur">${durs.map(m => `<option value="${m}"${m === dur ? ' selected' : ''}>${m < 60 ? m + ' мин' : (m / 60) + ' ч' + (m % 60 ? ' ' + m % 60 + ' мин' : '')}</option>`).join('')}</select></label>
      <label class="field"><span>Услуга</span><input id="fSvc" list="svcList" autocomplete="off" placeholder="Например: пломба, чистка" value="${esc(a ? a.service : '')}"><datalist id="svcList">${services.map(s => `<option value="${esc(s)}">`).join('')}</datalist></label>
      <label class="field"><span>Заметка</span><textarea id="fNote" rows="3" placeholder="Зуб, жалобы, что подготовить">${esc(a ? a.note : '')}</textarea></label>
      ${a ? `<div class="seg" id="seg">${Object.entries(STATUS).map(([k, v]) => `<button data-st="${k}" class="${k === status ? 'on' : ''}">${v}</button>`).join('')}</div>` : ''}
      <div class="warn" id="warn"></div>
      <button class="btn primary" data-x="save">Сохранить</button>
      ${a && (p && p.phone) ? `<div class="btns"><a class="btn" href="tel:${esc(p.phone.replace(/[^\d+]/g, ''))}">Позвонить</a><button class="btn" data-x="card">Карточка</button></div>` : ''}
      ${a ? '<button class="btn danger" data-x="del">Удалить запись</button>' : ''}
    </div>`, root => {
    const fName = root.querySelector('#fName'), fPhone = root.querySelector('#fPhone');
    const sugg = root.querySelector('#sugg');
    const showSugg = () => {
      const q = fName.value.trim().toLowerCase();
      if (!q || selPid) { sugg.innerHTML = ''; return; }
      const m = db.patients.filter(x => x.name.toLowerCase().includes(q) || (x.phone || '').includes(q)).slice(0, 6);
      sugg.innerHTML = m.map(x => `<button data-pid="${x.id}">${esc(x.name)}<small>${esc(x.phone || '')}</small></button>`).join('');
    };
    fName.addEventListener('input', () => { if (selPid && getP(selPid).name !== fName.value) selPid = null; showSugg(); });
    sugg.addEventListener('click', e => {
      const b = e.target.closest('[data-pid]'); if (!b) return;
      const x = getP(b.dataset.pid); selPid = x.id; fName.value = x.name; fPhone.value = x.phone || ''; sugg.innerHTML = '';
    });
    const checkConflict = () => {
      const d = root.querySelector('#fDate').value, t = root.querySelector('#fTime').value, du = Number(root.querySelector('#fDur').value);
      const w = root.querySelector('#warn');
      if (!d || !t) { w.textContent = ''; return; }
      const s = toMin(t), e = s + du;
      const hit = db.appts.filter(x => x.date === d && x.id !== id && x.status !== 'cancelled' && toMin(x.time) < e && toMin(x.time) + Number(x.dur || 30) > s);
      w.textContent = hit.length ? '⚠️ Пересекается: ' + hit.map(x => x.time + ' ' + pName(x)).join(', ') : '';
    };
    ['#fDate', '#fTime', '#fDur'].forEach(s => root.querySelector(s).addEventListener('change', checkConflict));
    checkConflict();
    const seg = root.querySelector('#seg');
    if (seg) seg.addEventListener('click', e => {
      const b = e.target.closest('[data-st]'); if (!b) return;
      status = b.dataset.st; seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    });
    root.onclick = e => {
      const x = e.target.closest('[data-x]'); if (!x) return;
      const act = x.dataset.x;
      if (act === 'close') return closeSheet();
      if (act === 'card') { const pid = a.patientId; closeSheet(); return setTimeout(() => patientSheet(pid), 280); }
      if (act === 'del') {
        if (!confirm('Удалить эту запись?')) return;
        db.appts = db.appts.filter(y => y.id !== id); save(); closeSheet(); render(); toast('Запись удалена'); return calSync();
      }
      if (act === 'save') {
        const name = fName.value.trim(), phone = fPhone.value.trim();
        const d = root.querySelector('#fDate').value, t = root.querySelector('#fTime').value;
        if (!name) { fName.focus(); return toast('Укажите пациента'); }
        if (!d || !t) return toast('Укажите дату и время');
        let pid = selPid;
        if (!pid) {
          const same = db.patients.filter(y => y.name.trim().toLowerCase() === name.toLowerCase());
          if (same.length === 1) pid = same[0].id;
        }
        if (!pid) { const np = { id: uid(), name, phone, note: '', created: Date.now() }; db.patients.push(np); pid = np.id; }
        else if (phone && getP(pid).phone !== phone) getP(pid).phone = phone;
        const rec = a || { id: uid(), created: Date.now() };
        Object.assign(rec, { patientId: pid, date: d, time: t, dur: Number(root.querySelector('#fDur').value), service: root.querySelector('#fSvc').value.trim(), note: root.querySelector('#fNote').value.trim(), status });
        if (!a) db.appts.push(rec);
        save();
        state.sel = d; state.tab = state.tab === 'more' ? 'day' : state.tab;
        closeSheet(); render(); toast(a ? 'Сохранено' : 'Пациент записан');
        calSync();
      }
    };
  });
}

// ---------- карточка пациента ----------
function patientSheet(pid) {
  const p = pid ? getP(pid) : null;
  const visits = p ? db.appts.filter(a => a.patientId === pid).sort(byTime) : [];
  const t = today();
  const future = visits.filter(a => a.date >= t), past = visits.filter(a => a.date < t).reverse();
  const vRow = a => `<button class="row" data-x="appt" data-v="${a.id}"><div>${dateLabel(a.date)}, ${a.time}${a.service ? `<small>${esc(a.service)}</small>` : ''}</div><div class="r">${a.status && a.status !== 'planned' ? STATUS[a.status] : ''}</div></button>`;
  openSheet(`
    <div class="sh-head"><button class="link" data-x="close">Отмена</button><b>${p ? 'Пациент' : 'Новый пациент'}</b><button class="link strong" data-x="save">Готово</button></div>
    <div class="form">
      <label class="field"><span>Имя и фамилия</span><input id="pName" autocapitalize="words" value="${esc(p ? p.name : '')}"></label>
      <label class="field"><span>Телефон</span><input id="pPhone" type="tel" placeholder="+371 …" value="${esc(p ? p.phone : '')}"></label>
      <label class="field"><span>Заметки</span><textarea id="pNote" rows="4" placeholder="Аллергии, особенности, план лечения">${esc(p ? p.note : '')}</textarea></label>
      ${p ? `<div class="btns">${p.phone ? `<a class="btn" href="tel:${esc(p.phone.replace(/[^\d+]/g, ''))}">Позвонить</a>` : ''}<button class="btn primary" data-x="book"${p.phone ? '' : ' style="grid-column:1/-1"'}>Записать</button></div>` : '<button class="btn primary" data-x="save">Сохранить</button>'}
      ${p ? `
        <div class="h2" style="margin-top:12px">Предстоящие визиты</div>
        ${future.length ? `<div class="group">${future.map(vRow).join('')}</div>` : '<p class="p">Нет</p>'}
        <div class="h2">Прошлые визиты</div>
        ${past.length ? `<div class="group">${past.map(vRow).join('')}</div>` : '<p class="p">Нет</p>'}
        <button class="btn danger" data-x="del" style="margin-top:12px">Удалить пациента</button>` : ''}
    </div>`, root => {
    root.onclick = e => {
      const x = e.target.closest('[data-x]'); if (!x) return;
      const act = x.dataset.x;
      if (act === 'close') return closeSheet();
      if (act === 'appt') { const id = x.dataset.v; closeSheet(); return setTimeout(() => apptSheet(id), 280); }
      if (act === 'book') { persist(true); closeSheet(); return setTimeout(() => apptSheet(null, { patientId: pid, date: today() }), 280); }
      if (act === 'del') {
        const n = visits.length;
        if (!confirm(`Удалить пациента${n ? ' и ' + n + ' ' + plural(n, 'запись', 'записи', 'записей') : ''}?`)) return;
        db.patients = db.patients.filter(y => y.id !== pid);
        db.appts = db.appts.filter(y => y.patientId !== pid);
        save(); closeSheet(); render(); toast('Пациент удалён'); return calSync();
      }
      if (act === 'save') { if (persist()) { closeSheet(); render(); toast('Сохранено'); calSync(); } }
    };
    function persist(silent) {
      const name = root.querySelector('#pName').value.trim();
      if (!name) { if (!silent) toast('Укажите имя'); return false; }
      const rec = p || { id: uid(), created: Date.now() };
      Object.assign(rec, { name, phone: root.querySelector('#pPhone').value.trim(), note: root.querySelector('#pNote').value.trim() });
      if (!p) db.patients.push(rec);
      save(); return true;
    }
  });
}

// ---------- календарь iPhone (через быструю команду «Записи») ----------
// Данные не уходят в интернет: приложение передаёт их команде на этом же телефоне.
const SYNC_KEY = 'dent-sync', SHORTCUT = 'Записи';
const SHORTCUT_FILE = 'zapisi.shortcut';
function syncCfg() { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { return {}; } }
function setSyncCfg(c) { try { localStorage.setItem(SYNC_KEY, JSON.stringify(c)); } catch (e) {} }
function calPayload() {
  const t = today();
  const events = db.appts.filter(a => a.date >= t && a.status !== 'cancelled').sort(byTime).map(a => {
    const p = getP(a.patientId) || {}, s = toMin(a.time), e = s + Number(a.dur || 30);
    const endDate = e >= 24 * 60 ? addDays(a.date, 1) : a.date;
    return {
      title: (p.name || 'Пациент') + (a.service ? ' — ' + a.service : ''),
      start: a.date + ' ' + a.time,
      end: endDate + ' ' + fromMin(e),
      notes: [p.phone && 'Тел.: ' + p.phone, a.note].filter(Boolean).join('\n')
    };
  });
  return JSON.stringify({ events });
}
// force — синхронизировать, даже если с прошлого раза ничего не изменилось
function calSync(force) {
  const c = syncCfg();
  if (!c.on) return;
  const text = calPayload();
  if (!force && text === c.last) return;
  c.last = text; setSyncCfg(c);
  const url = 'shortcuts://run-shortcut?name=' + encodeURIComponent(SHORTCUT) + '&input=text&text=' + encodeURIComponent(text);
  setTimeout(() => { location.href = url; }, 400);
}

// ---------- резервная копия ----------
async function exportData() {
  const name = `zapisi-${today()}.json`;
  const blob = new Blob([JSON.stringify({ app: 'zapisi', version: 1, exported: new Date().toISOString(), patients: db.patients, appts: db.appts }, null, 1)], { type: 'application/json' });
  const file = new File([blob], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
    } else {
      const u = URL.createObjectURL(blob), l = document.createElement('a');
      l.href = u; l.download = name; document.body.appendChild(l); l.click(); l.remove();
      setTimeout(() => URL.revokeObjectURL(u), 5000);
    }
    db.lastBackup = Date.now(); save(); render(); toast('Копия сохранена');
  } catch (e) {
    if (e.name !== 'AbortError') toast('Не получилось: ' + e.message);
  }
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.patients) || !Array.isArray(d.appts)) throw new Error('это не файл копии');
    if (!confirm(`В файле: ${d.patients.length} пациентов и ${d.appts.length} записей.\nЗаменить ими текущие данные?`)) return;
    db = { patients: d.patients, appts: d.appts, lastBackup: Date.now() };
    save(); render(); toast('Данные восстановлены'); calSync();
  } catch (err) { alert('Не удалось открыть файл: ' + err.message); }
});

// ---------- события ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const v = b.dataset.v;
  switch (b.dataset.act) {
    case 'pick': state.sel = v; render(); break;
    case 'shift': state.sel = addDays(state.sel, Number(v)); render(); break;
    case 'appt': apptSheet(v); break;
    case 'patient': patientSheet(v); break;
    case 'tab': state.tab = v; render(); scrollTo(0, 0); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'syncnow':
      if (!syncCfg().on) { toast('Сначала включите синхронизацию'); break; }
      calSync(true); break;
  }
});
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  state.tab = b.dataset.tab; render(); scrollTo(0, 0);
});
$('#fab').addEventListener('click', () => state.tab === 'patients' ? patientSheet(null) : apptSheet(null));
$('#sheetWrap').addEventListener('click', e => { if (e.target.dataset.x === 'close' && e.target.classList.contains('backdrop')) closeSheet(); });

// свайп влево-вправо по экрану записей меняет день
let sx = null, sy = 0;
$('#main').addEventListener('touchstart', e => { if (state.tab !== 'day' || e.target.closest('.week')) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$('#main').addEventListener('touchend', e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 50) { state.sel = addDays(state.sel, dx < 0 ? 1 : -1); render(); }
}, { passive: true });

// при возвращении в приложение на следующий день — показать «сегодня»
let lastDay = today();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && today() !== lastDay) { if (state.sel === lastDay) state.sel = today(); lastDay = today(); render(); }
});

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
